<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chart7 borough map</title>
  <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/map.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; }
    #chartdiv { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="chartdiv"></div>
  <script>
    // Share of private renters (rent-stabilized + market-rate) who are rent-stabilized, 2023 NYCHVS (weighted).
    // Staten Island has no value: only 27 stabilized households were surveyed.
    var boroughData = [
      { id: "36005", name: "Bronx",         share: 67.2, income: "$39,000" },
      { id: "36047", name: "Brooklyn",      share: 44.1, income: "$66,020" },
      { id: "36061", name: "Manhattan",     share: 43.7, income: "$76,000" },
      { id: "36081", name: "Queens",        share: 38.7, income: "$68,826" }
    ];

    // Borough outlines (amCharts geodata, New York counties)
    var boroughShapes = {"type":"FeatureCollection","features":[{"type":"Feature","id":"36085","properties":{"name":"Staten Island"},"geometry":{"type":"Polygon","coordinates":[[[-74.071,40.637],[-74.069,40.622],[-74.055,40.609],[-74.052,40.601],[-74.069,40.581],[-74.127,40.534],[-74.138,40.543],[-74.148,40.531],[-74.186,40.516],[-74.194,40.511],[-74.235,40.499],[-74.251,40.504],[-74.239,40.529],[-74.241,40.544],[-74.229,40.553],[-74.217,40.554],[-74.201,40.573],[-74.202,40.582],[-74.196,40.591],[-74.193,40.607],[-74.194,40.629],[-74.176,40.641],[-74.153,40.637],[-74.128,40.639],[-74.071,40.647],[-74.071,40.637]]]}},{"type":"Feature","id":"36081","properties":{"name":"Queens"},"geometry":{"type":"MultiPolygon","coordinates":[[[[-73.752,40.785],[-73.706,40.75],[-73.704,40.736],[-73.729,40.724],[-73.727,40.71],[-73.725,40.652],[-73.741,40.647],[-73.746,40.634],[-73.758,40.629],[-73.759,40.635],[-73.787,40.642],[-73.81,40.653],[-73.825,40.65],[-73.841,40.653],[-73.853,40.648],[-73.86,40.658],[-73.854,40.667],[-73.869,40.693],[-73.886,40.684],[-73.919,40.711],[-73.924,40.723],[-73.947,40.738],[-73.954,40.74],[-73.948,40.756],[-73.935,40.768],[-73.926,40.783],[-73.915,40.792],[-73.899,40.797],[-73.886,40.79],[-73.865,40.792],[-73.856,40.776],[-73.847,40.777],[-73.852,40.792],[-73.839,40.797],[-73.832,40.793],[-73.82,40.8],[-73.787,40.792],[-73.776,40.797],[-73.764,40.777],[-73.752,40.785]]],[[[-73.821,40.604],[-73.828,40.618],[-73.84,40.629],[-73.835,40.639],[-73.82,40.636],[-73.816,40.621],[-73.809,40.613],[-73.821,40.604]]],[[[-73.761,40.614],[-73.745,40.612],[-73.737,40.602],[-73.737,40.593],[-73.753,40.589],[-73.771,40.59],[-73.796,40.585],[-73.862,40.563],[-73.893,40.556],[-73.907,40.556],[-73.935,40.543],[-73.934,40.556],[-73.923,40.563],[-73.874,40.569],[-73.844,40.582],[-73.825,40.585],[-73.809,40.595],[-73.761,40.614]]]]}},{"type":"Feature","id":"36061","properties":{"name":"Manhattan"},"geometry":{"type":"Polygon","coordinates":[[[-73.936,40.879],[-73.913,40.874],[-73.911,40.865],[-73.929,40.839],[-73.933,40.821],[-73.929,40.808],[-73.921,40.801],[-73.93,40.794],[-73.944,40.774],[-73.964,40.751],[-73.968,40.734],[-73.976,40.719],[-74.009,40.7],[-74.027,40.703],[-74.013,40.759],[-73.97,40.816],[-73.936,40.879]]]}},{"type":"Feature","id":"36047","properties":{"name":"Brooklyn"},"geometry":{"type":"Polygon","coordinates":[[[-73.853,40.648],[-73.867,40.649],[-73.876,40.64],[-73.895,40.634],[-73.911,40.635],[-73.887,40.617],[-73.897,40.609],[-73.882,40.604],[-73.875,40.588],[-73.877,40.582],[-73.892,40.579],[-73.915,40.601],[-73.926,40.601],[-73.918,40.583],[-73.945,40.584],[-73.934,40.575],[-73.989,40.569],[-73.99,40.581],[-73.997,40.593],[-74.037,40.609],[-74.037,40.635],[-74.016,40.656],[-74.01,40.668],[-74.017,40.679],[-73.986,40.703],[-73.967,40.712],[-73.96,40.719],[-73.954,40.74],[-73.947,40.738],[-73.924,40.723],[-73.919,40.711],[-73.886,40.684],[-73.869,40.693],[-73.854,40.667],[-73.86,40.658],[-73.853,40.648]]]}},{"type":"Feature","id":"36005","properties":{"name":"Bronx"},"geometry":{"type":"Polygon","coordinates":[[[-73.917,40.92],[-73.859,40.901],[-73.842,40.902],[-73.832,40.892],[-73.781,40.88],[-73.78,40.873],[-73.79,40.862],[-73.803,40.869],[-73.807,40.862],[-73.803,40.85],[-73.809,40.833],[-73.793,40.81],[-73.805,40.808],[-73.822,40.815],[-73.828,40.826],[-73.839,40.826],[-73.85,40.815],[-73.865,40.821],[-73.871,40.812],[-73.889,40.815],[-73.921,40.801],[-73.929,40.808],[-73.933,40.821],[-73.929,40.839],[-73.911,40.865],[-73.913,40.874],[-73.936,40.879],[-73.917,40.92]]]}}]};

    // Where each borough's label sits on the map
    var labelSpots = [
      { name: "Bronx",         text: "Bronx\n67%",          lon: -73.865, lat: 40.848, color: "#ffffff" },
      { name: "Brooklyn",      text: "Brooklyn\n44%",       lon: -73.950, lat: 40.645, color: "#1d2433" },
      { name: "Manhattan",     text: "Manhattan\n44%",      lon: -74.050, lat: 40.790, color: "#1d2433" },
      { name: "Queens",        text: "Queens\n39%",         lon: -73.800, lat: 40.715, color: "#1d2433" },
      { name: "Staten Island", text: "Staten Island\nToo few surveyed", lon: -74.150, lat: 40.580, color: "#555555" }
    ];

    am5.ready(function () {
      var root = am5.Root.new("chartdiv");
      window.chartRoot = root;
      root.container.set("layout", root.verticalLayout);
      root.container.setAll({ paddingTop: 20, paddingBottom: 20, paddingLeft: 20, paddingRight: 20 });

      // Title and subtitle
      root.container.children.push(am5.Label.new(root, {
        text: "The freeze hits the Bronx hardest",
        fontSize: 20, fontWeight: "600",
        x: am5.p50, centerX: am5.p50, paddingBottom: 4
      }));
      root.container.children.push(am5.Label.new(root, {
        text: "Share of private renters who are rent-stabilized, by borough, 2023",
        fontSize: 14, fill: am5.color(0x555555),
        x: am5.p50, centerX: am5.p50, paddingBottom: 6
      }));

      // Map
      var chart = root.container.children.push(am5map.MapChart.new(root, {
        projection: am5map.geoMercator(),
        panX: "none", panY: "none", wheelX: "none", wheelY: "none",
        height: am5.percent(100)
      }));

      var polygons = chart.series.push(am5map.MapPolygonSeries.new(root, {
        geoJSON: boroughShapes,
        valueField: "share",
        calculateAggregates: true
      }));

      polygons.mapPolygons.template.setAll({
        fill: am5.color(0xd5d9de),
        stroke: am5.color(0xffffff),
        strokeWidth: 2,
        tooltipText: "[bold]{name}[/]\nToo few stabilized households surveyed for a reliable estimate"
      });

      // Darker red = larger share of renters who are rent-stabilized
      polygons.set("heatRules", [{
        target: polygons.mapPolygons.template,
        dataField: "value",
        min: am5.color(0xf3c9c3),
        max: am5.color(0xc0392b),
        key: "fill"
      }]);

      polygons.data.setAll(boroughData);

      // Tooltip for boroughs with data
      polygons.mapPolygons.template.adapters.add("tooltipText", function (text, target) {
        var d = target.dataItem && target.dataItem.dataContext;
        if (d && d.share) {
          return "[bold]{name}[/]\n{share}% of private renters are rent-stabilized\nMedian stabilized household income: {income}";
        }
        return text;
      });

      // Borough labels
      var labels = chart.series.push(am5map.MapPointSeries.new(root, {}));
      labels.bullets.push(function (root, series, dataItem) {
        return am5.Bullet.new(root, {
          sprite: am5.Label.new(root, {
            text: dataItem.dataContext.text,
            fill: am5.color(dataItem.dataContext.color),
            fontSize: 14, fontWeight: "600", textAlign: "center",
            centerX: am5.p50, centerY: am5.p50, populateText: true
          })
        });
      });
      labelSpots.forEach(function (s) {
        labels.data.push({ geometry: { type: "Point", coordinates: [s.lon, s.lat] }, text: s.text, color: s.color });
      });

      // Color key
      var legend = root.container.children.push(am5.HeatLegend.new(root, {
        orientation: "horizontal",
        startColor: am5.color(0xf3c9c3),
        endColor: am5.color(0xc0392b),
        startText: "39%",
        endText: "67%",
        stepCount: 1,
        width: 320,
        x: am5.p50, centerX: am5.p50, paddingTop: 10
      }));
      legend.startLabel.setAll({ fontSize: 12, fill: am5.color(0x555555) });
      legend.endLabel.setAll({ fontSize: 12, fill: am5.color(0x555555) });

      // Source
      root.container.children.push(am5.Label.new(root, {
        text: "Source: Analysis of the 2023 NYC Housing and Vacancy Survey (weighted). Private renters = rent-stabilized plus market-rate; excludes public housing and rent control.\nStaten Island shown in gray: only 27 stabilized households were surveyed, too few for a reliable estimate.",
        fontSize: 11, fill: am5.color(0x666666), paddingTop: 12
      }));

      chart.appear(1000, 100);
    });
  </script>
</body>
</html>
